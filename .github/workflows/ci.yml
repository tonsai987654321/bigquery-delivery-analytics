name: ci

# Syntax gates that need no cloud credentials, so they run on every push and PR
# of a public repo. The data quality gate itself lives in
# sql/03_quality_checks.sql and runs against BigQuery — see the README for why
# it is not wired in here.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  shell:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint shell scripts
        run: shellcheck 01_load.sh 05_benchmark.sh data/download.sh

  sql:
    name: sqlfluff parse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install sqlfluff
        run: pip install --no-cache-dir 'sqlfluff==4.3.0'
      - name: Parse every SQL file against the BigQuery dialect
        run: sqlfluff parse sql/
